services:
  db:
    image: postgres:16-alpine
    container_name: djdesk_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: djdesk
      POSTGRES_PASSWORD: djdesk_secret
      POSTGRES_DB: djdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: djdesk_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://djdesk:djdesk_secret@db:5432/djdesk
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
